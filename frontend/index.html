    <meta name="description" content="Open-source OAuth 2.0 and OpenID Connect identity provider with PKCE, automated JWKS rotation, and DNS-based domain verification." />

    <!-- Fonts: Inter for UI & JetBrains Mono for Code -->

    <!-- Default to Light screen unless user explicitly chose dark -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('pramaan_theme') === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
