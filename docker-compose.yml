services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - pramaan
    networks:
      - pramaan-network
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  pramaan:
    image: anuj304/pramaan:latest
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    command: ["node", "dist/index.js"]
    networks:
      - pramaan-network

    mem_limit: 400m
    cpus: 0.5

    security_opt:
      - no-new-privileges:true
    
    read_only: true
    tmpfs:
      - /tmp

    init: true

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', r => { if(r.statusCode === 200) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  alloy:
    image: grafana/alloy:v1.0.0
    restart: unless-stopped
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - GRAFANA_CLOUD_LOKI_URL=${GRAFANA_CLOUD_LOKI_URL}
      - GRAFANA_CLOUD_LOKI_USER=${GRAFANA_CLOUD_LOKI_USER}
      - GRAFANA_CLOUD_LOKI_TOKEN=${GRAFANA_CLOUD_LOKI_TOKEN}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      - pramaan
      - caddy
    networks:
      - pramaan-network

volumes:
  caddy_data:
  caddy_config:

networks:
  pramaan-network:
    driver: bridge
