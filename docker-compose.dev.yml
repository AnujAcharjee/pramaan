services:
  pramaan-dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src:delegated
      - ./prisma:/app/prisma:delegated
      - ./package.json:/app/package.json:delegated
      - ./package-lock.json:/app/package-lock.json:delegated
      - ./tsconfig.json:/app/tsconfig.json:delegated
      - ./scripts:/app/scripts:delegated
      - ./tsconfig.scripts.json:/app/tsconfig.scripts.json:delegated
      - ./nodemon.json:/app/nodemon.json:delegated
      - ./tailwind.config.js:/app/tailwind.config.js:delegated
      - api_node_modules:/app/node_modules
      - api_dist:/app/dist
    ports:
      - "8080:8080"
    env_file:
      - .env
    # depends_on:
    #   redis:
    #     condition: service_healthy
    command: |
      sh -c '
        npm run prisma:generate &&
        npx concurrently "npm run css:dev" "npm run dev"
      '
    networks:
      - pramaan-dev-network
    restart: unless-stopped

  redis:
    image: redis:8.4.0
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-devpassword}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devpassword}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pramaan-dev-network

  alloy:
    image: grafana/alloy:v1.0.0
    restart: unless-stopped
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - GRAFANA_CLOUD_LOKI_URL=${GRAFANA_CLOUD_LOKI_URL}
      - GRAFANA_CLOUD_LOKI_USER=${GRAFANA_CLOUD_LOKI_USER}
      - GRAFANA_CLOUD_LOKI_TOKEN=${GRAFANA_CLOUD_LOKI_TOKEN}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    networks:
      - pramaan-dev-network

volumes:
  redis-data:
  api_node_modules:
  api_dist:

networks:
  pramaan-dev-network:
    driver: bridge
